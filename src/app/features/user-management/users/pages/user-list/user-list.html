<div class="user-list-container">

  <!-- PAGE HEADER -->
  <div class="page-header">
    <div>
      <h2 class="page-title">Users</h2>
      <p class="page-subtitle">
        Manage all system users
      </p>
    </div>

    <button
      mat-raised-button
      color="primary"
      routerLink="/users/create">
      <mat-icon>add</mat-icon>
      Add User
    </button>
  </div>

  <!-- FILTER SECTION -->
  <mat-card class="filter-card">
    <mat-card-content class="filter-container">
      <mat-form-field appearance="outline">
        <mat-label>Search</mat-label>
        <input
          matInput
          placeholder="Search user..."
          (keyup)="applyFilter($event)">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </mat-card-content>
  </mat-card>

  <!-- TABLE -->
  <mat-card class="table-card">
    <mat-card-content class="table-responsive">

      <table
        mat-table
        [dataSource]="dataSource"
        matSort
        class="user-table">

        <!-- NAME -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Name
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.name }}
          </td>
        </ng-container>

        <!-- EMAIL -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Email
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.email }}
          </td>
        </ng-container>

        <!-- ROLE -->
        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Role
          </th>
          <td mat-cell *matCellDef="let row">
            <span class="role-badge">
              {{ row.role }}
            </span>
          </td>
        </ng-container>

        <!-- STATUS -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Status
          </th>
          <td mat-cell *matCellDef="let row">
            @if (row.isActive) {
              <span class="status-badge active">Active</span>
            } @else {
              <span class="status-badge inactive">Inactive</span>
            }
          </td>
        </ng-container>

        <!-- MAPPING -->
        <ng-container matColumnDef="mapping">
          <th mat-header-cell *matHeaderCellDef>
            Mapping
          </th>
          <td mat-cell *matCellDef="let row">
            <button
              mat-stroked-button
              color="accent"
              [routerLink]="['/mappings/user-role', row.userId]">
              Mapping
            </button>
          </td>
        </ng-container>

        <!-- ACTION -->
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>
            Action
          </th>
          <td mat-cell *matCellDef="let row">
            <div class="action-buttons">
              <!-- VIEW -->
              <button
                mat-icon-button
                color="primary"
                [routerLink]="['/users/view', row.userId]">
                <mat-icon>visibility</mat-icon>
              </button>

              <!-- EDIT -->
              <button
                mat-icon-button
                color="accent"
                [routerLink]="['/users/edit', row.userId]">
                <mat-icon>edit</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <!-- HEADER & ROW DEFINITIONS -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>

    </mat-card-content>

    <!-- PAGINATION -->
    <mat-paginator
      [pageSize]="10"
      [pageSizeOptions]="[5, 10, 20, 50]"
      showFirstLastButtons>
    </mat-paginator>

  </mat-card>

</div>
