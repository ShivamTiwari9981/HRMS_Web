<div class="employee-container">

  <div class="header">
    <h2>Employees</h2>
    <button
      mat-raised-button
      color="primary"
      (click)="addEmployee()">
      <mat-icon>add</mat-icon>
      Add Employee
    </button>
  </div>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Search Employee</mat-label>
    <input
      matInput
      [formControl]="searchControl"
      placeholder="Name, Email, Employee Code">
  </mat-form-field>

  <div class="table-container">
    <table
      mat-table
      [dataSource]="employees"
      matSort>

      <ng-container matColumnDef="EmployeeCode">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Employee Code
        </th>
        <td mat-cell *matCellDef="let row">
          {{row.EmployeeCode}}
        </td>
      </ng-container>

      <ng-container matColumnDef="FullName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Name
        </th>
        <td mat-cell *matCellDef="let row">
          {{row.FullName}}
        </td>
      </ng-container>

      <ng-container matColumnDef="EmployeeEmail">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Email
        </th>
        <td mat-cell *matCellDef="let row">
          {{row.EmployeeEmail}}
        </td>
      </ng-container>

      <ng-container matColumnDef="DepartmentName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Department
        </th>
        <td mat-cell *matCellDef="let row">
          {{row.DepartmentName}}
        </td>
      </ng-container>

      <ng-container matColumnDef="DesignationName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Designation
        </th>
        <td mat-cell *matCellDef="let row">
          {{row.DesignationName}}
        </td>
      </ng-container>

      <ng-container matColumnDef="JoiningDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Joining Date
        </th>
        <td mat-cell *matCellDef="let row">
          {{row.JoiningDate | date}}
        </td>
      </ng-container>

      <ng-container matColumnDef="Status">
        <th mat-header-cell *matHeaderCellDef>
          Status
        </th>
        <td mat-cell *matCellDef="let row">
          @if (row.IsActive) {
            <span class="status-active">Active</span>
          } @else {
            <span class="status-inactive">Inactive</span>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="Action">
        <th mat-header-cell *matHeaderCellDef>
          Action
        </th>
        <td mat-cell *matCellDef="let row">
          <div class="action-buttons">
            <button
              mat-icon-button
              color="primary"
              aria-label="Edit employee"
              (click)="editEmployee(row.EmployeeId)">
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              color="warn"
              aria-label="Delete employee"
              (click)="deleteEmployee(row.EmployeeId)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>
  </div>

  <mat-paginator
    [length]="totalRecords"
    [pageSize]="pageSize"
    [pageSizeOptions]="[10, 25, 50, 100]"
    showFirstLastButtons>
  </mat-paginator>

</div>
