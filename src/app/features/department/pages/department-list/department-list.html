<div class="employee-container">

   <div class="header">
    <h2>Departments</h2>
    <button
      mat-raised-button
      color="primary"
      (click)="addDepartment()">
      <mat-icon>add</mat-icon>
      Add Department
    </button>
  </div>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Search Department</mat-label>
    <input
      matInput
      [formControl]="searchControl"
      placeholder="Name or Department Code">
  </mat-form-field>

  <div class="table-container">
    <table
      mat-table
      [dataSource]="department"
      matSort>
      <ng-container matColumnDef="DepartmentCode">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Department Code
        </th>
        <td mat-cell *matCellDef="let row">
          {{ row.DepartmentCode }}
        </td>
      </ng-container>

      <ng-container matColumnDef="DepartmentName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Name
        </th>
        <td mat-cell *matCellDef="let row">
          {{ row.DepartmentName }}
        </td>
      </ng-container>


      <ng-container matColumnDef="Description">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Description
        </th>
        <td mat-cell *matCellDef="let row">
          {{ row.Description }}
        </td>
      </ng-container>

      <ng-container matColumnDef="Status">
        <th mat-header-cell *matHeaderCellDef>
          Status
        </th>
        <td mat-cell *matCellDef="let row">
             @if (row.IsActive) {
            <span class="status-active">Active</span>
          } @else {
            <span class="status-inactive">Inactive</span>
          }
          
        </td>
      </ng-container>

      <ng-container matColumnDef="Action">
        <th mat-header-cell *matHeaderCellDef>
          Action
        </th>

        <td mat-cell *matCellDef="let row" class="action-cell">
         @if (row.IsActive){
          <button
            mat-icon-button
            color="primary"
            aria-label="Edit department"
            (click)="editDepartment(row.DepartmentId)">
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            color="primary"
            aria-label="Delete department"
            (click)="deleteDepartment(row.DepartmentId)">
            <mat-icon>delete</mat-icon>
          </button>
         }
         @else {
          <button
            mat-icon-button
            color="warn"
            aria-label="Delete department"
            (click)="reopenDepartment(row.DepartmentId)">
            <mat-icon>reopen</mat-icon>
          </button>
         }
          
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>
  </div>

</div>
