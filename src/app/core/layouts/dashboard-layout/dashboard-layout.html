<mat-sidenav-container class="layout-container">

  <mat-sidenav
    #drawer
    mode="side"
    opened
    class="sidebar">

    <app-sidebar></app-sidebar>

  </mat-sidenav>

  <mat-sidenav-content>

    <app-navbar (toggleSidebar)="drawer.toggle()">
    </app-navbar>

    <div class="page-content">
      <router-outlet></router-outlet>
    </div>

    <app-footer></app-footer>

  </mat-sidenav-content>

</mat-sidenav-container>
